<!doctype html><html lang="en"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Offgrid Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,600&display=swap">
<style>
/* Layout: a drafting table. Command bar and formula strip on top, a free canvas between an insert rail and a design rail. */
:root {
  --bg: #eef1ef;
  --panel: #fafbfa;
  --panel-2: #f1f4f2;
  --ink: #15201c;
  --ink-2: #47564f;
  --ink-3: #74837c;
  --line: #d9e0dc;
  --accent: #0d7a68;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --guide: #d11f9a;
  --danger: #c0392f;
  --warn-bg: #fdf1d6;
  --warn-ink: #7a5300;
  --shadow: 0 1px 2px rgba(15, 30, 25, .08), 0 8px 24px rgba(15, 30, 25, .10);
  --scrim: rgba(10, 18, 15, .45);
  --t-ref: #8a4b00; --t-ref-bg: rgba(237, 161, 0, .16); --t-str: #a3336b; --t-num: #2a62b8; --t-param: #6a3fb5;
  /* dashboard surface tokens: what elements on the canvas draw with */
  --d-page: #f4f6f4;
  --d-dot: #cfd7d2;
  --d-surface: #ffffff;
  --d-ink: #111a17;
  --d-ink2: #52605a;
  --d-muted: #86928c;
  --d-grid: #e3e8e5;
  --d-border: rgba(17, 26, 23, .11);
  --d-good: #006300;
  --d-bad: #b3261e;
  --d-shadow: 0 1px 2px rgba(17, 26, 23, .06), 0 6px 18px rgba(17, 26, 23, .07);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-mark: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111514; --panel: #191e1c; --panel-2: #202624; --ink: #edf2ef; --ink-2: #b3c0ba; --ink-3: #82908a;
    --line: #2c3532; --accent: #46c2aa; --accent-ink: #05211b; --accent-soft: #17352f; --guide: #ff62cb;
    --danger: #f0776c; --warn-bg: #3a2f12; --warn-ink: #f3cf7a; --scrim: rgba(0, 0, 0, .6);
    --t-ref: #f0c065; --t-ref-bg: rgba(237, 161, 0, .14); --t-str: #f08fbd; --t-num: #7fb2f5; --t-param: #b6a3f5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
    --d-page: #0f1312; --d-dot: #283230; --d-surface: #1a201e; --d-ink: #f1f5f3; --d-ink2: #bac5c0; --d-muted: #808c87;
    --d-grid: #2a3230; --d-border: rgba(255, 255, 255, .11); --d-good: #0ca30c; --d-bad: #e66767;
    --d-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .3);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111514; --panel: #191e1c; --panel-2: #202624; --ink: #edf2ef; --ink-2: #b3c0ba; --ink-3: #82908a;
  --line: #2c3532; --accent: #46c2aa; --accent-ink: #05211b; --accent-soft: #17352f; --guide: #ff62cb;
  --danger: #f0776c; --warn-bg: #3a2f12; --warn-ink: #f3cf7a; --scrim: rgba(0, 0, 0, .6);
  --t-ref: #f0c065; --t-ref-bg: rgba(237, 161, 0, .14); --t-str: #f08fbd; --t-num: #7fb2f5; --t-param: #b6a3f5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
  --d-page: #0f1312; --d-dot: #283230; --d-surface: #1a201e; --d-ink: #f1f5f3; --d-ink2: #bac5c0; --d-muted: #808c87;
  --d-grid: #2a3230; --d-border: rgba(255, 255, 255, .11); --d-good: #0ca30c; --d-bad: #e66767;
  --d-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .3);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
/* a dashboard can pin its own theme regardless of the viewer's */
.d-light {
  --d-page: #f4f6f4; --d-dot: #cfd7d2; --d-surface: #ffffff; --d-ink: #111a17; --d-ink2: #52605a; --d-muted: #86928c;
  --d-grid: #e3e8e5; --d-border: rgba(17, 26, 23, .11); --d-good: #006300; --d-bad: #b3261e;
  --d-shadow: 0 1px 2px rgba(17, 26, 23, .06), 0 6px 18px rgba(17, 26, 23, .07);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
.d-dark {
  --d-page: #0f1312; --d-dot: #283230; --d-surface: #1a201e; --d-ink: #f1f5f3; --d-ink2: #bac5c0; --d-muted: #808c87;
  --d-grid: #2a3230; --d-border: rgba(255, 255, 255, .11); --d-good: #0ca30c; --d-bad: #e66767;
  --d-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .3);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
.app > .top { grid-row: 1; } .app > .fx { grid-row: 2; } .app > .main { grid-row: 3; } .app > .dock { grid-row: 4; }

/* ---------- command bar ---------- */
.top { display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.mark { font: 700 16px/1 var(--f-mark); letter-spacing: -.02em; display: flex; align-items: center; gap: 7px; flex: none; }
.mark i { width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; transform: rotate(-9deg) translate(1px, 1px); display: block; }
.board-name { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 7px; font-weight: 600; min-width: 60px; width: 190px; flex: 0 1 190px; text-overflow: ellipsis; }
.board-name:hover { border-color: var(--line); }
.board-name:focus { background: var(--bg); border-color: var(--accent); outline: none; }
.pages { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.pages::-webkit-scrollbar { display: none; }
.page-tab { display: flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 5px 9px; border-radius: 6px; color: var(--ink-2); white-space: nowrap; flex: none; }
.page-tab:hover { background: var(--panel-2); }
.page-tab.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.page-tab input { width: 110px; border: 1px solid var(--accent); border-radius: 4px; background: var(--panel); padding: 1px 4px; }
.page-tab .x { opacity: .55; display: inline-flex; border-radius: 4px; }
.page-tab .x:hover { opacity: 1; background: var(--line); }
.page-tab .x svg { width: 12px; height: 12px; }
.top-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 10px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.icon { padding: 5px 6px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 7px; font-size: 12px; border-radius: 6px; }
.status { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.status[data-s="saved"]::before { background: var(--accent); }
.status[data-s="saving"]::before { background: var(--warn-ink); }
.status[data-s="error"]::before { background: var(--danger); }
.status[data-s="error"] { color: var(--danger); }
.menu { position: absolute; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; min-width: 210px; display: flex; flex-direction: column; }
.menu button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; padding: 7px 9px; border-radius: 6px; }
.menu button:hover { background: var(--panel-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* ---------- formula strip ---------- */
.fx { display: flex; align-items: flex-start; gap: 8px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; min-width: 0; }
.fx-badge { font: 600 12px/1 var(--f-mono); font-style: italic; color: var(--accent-ink); background: var(--accent); border-radius: 5px; padding: 7px 7px; flex: none; margin-top: 1px; }
.fx.off .fx-badge { background: var(--ink-3); }
.fx select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 6px; max-width: 150px; flex: none; margin-top: 1px; }
.fx-edit { position: relative; flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
.fx-edit:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fx-edit.bad { border-color: var(--danger); }
.fx-hl, .fx-ta { font: 500 13px/20px var(--f-mono); padding: 5px 9px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; letter-spacing: 0; tab-size: 2; }
.fx-hl { position: absolute; inset: 0; pointer-events: none; color: var(--ink); overflow: hidden; }
.fx-ta { display: block; position: relative; width: 100%; height: 32px; max-height: 132px; border: 0; background: transparent; resize: none; outline: none; color: transparent; caret-color: var(--ink); overflow-y: auto; }
.fx-ta::placeholder { color: var(--ink-3); font-family: var(--f-ui); font-weight: 400; }
.fx-ta:disabled { cursor: default; }
.t-fn { color: var(--accent); font-weight: 600; }
.t-ref { color: var(--t-ref); background: var(--t-ref-bg); border-radius: 3px; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-param { color: var(--t-param); font-weight: 600; }
.t-err { text-decoration: wavy underline var(--danger); }
.t-dim { color: var(--ink-3); }
.fx-out { flex: 0 1 auto; max-width: 34%; min-width: 0; font: 500 12px/20px var(--f-mono); padding: 6px 2px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-out.bad { color: var(--danger); white-space: normal; font-family: var(--f-ui); line-height: 1.3; padding-block: 4px; }
.fx .btn { flex: none; margin-top: 1px; }
.ac { position: absolute; z-index: 70; top: 100%; left: 0; margin-top: 4px; min-width: 260px; max-width: min(420px, 92vw); max-height: 260px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); padding: 4px; }
.ac-item { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.ac-item.on { background: var(--accent-soft); }
.ac-item b { font: 600 12.5px var(--f-mono); white-space: nowrap; }
.ac-item span { color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ac-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; flex: none; }
.fnref { position: absolute; z-index: 70; right: 14px; top: 100%; margin-top: 4px; width: min(380px, calc(100vw - 28px)); max-height: min(60vh, 460px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.fnref input { margin: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--bg); }
.fnref-list { overflow-y: auto; padding: 0 6px 8px; }
.fnref h4 { margin: 8px 6px 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.fnref button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 6px; border-radius: 6px; }
.fnref button:hover { background: var(--panel-2); }
.fnref code { font: 600 12px var(--f-mono); color: var(--accent); display: block; }
.fnref small { color: var(--ink-2); }

/* ---------- workspace ---------- */
.main { display: grid; grid-template-columns: 236px minmax(0, 1fr) 272px; min-height: 0; position: relative; }
.rail { background: var(--panel); min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.rail.left { border-right: 1px solid var(--line); }
.rail.right { border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 4px; color: var(--ink-3); border-bottom: 2px solid transparent; font-weight: 600; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 7px; }
.sec > h3 { margin: 0; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); display: flex; align-items: center; justify-content: space-between; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 2px 7px; font-size: 11.5px; color: var(--ink-2); min-width: 0; }
.tile:hover { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.tile svg { width: 20px; height: 20px; }
.hint { color: var(--ink-3); font-size: 12px; line-height: 1.45; margin: 0; }
.layer { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer; min-width: 0; }
.layer:hover { background: var(--panel-2); }
.layer.on { background: var(--accent-soft); }
.layer .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer button { border: 0; background: transparent; padding: 2px; border-radius: 4px; color: var(--ink-3); display: inline-flex; }
.layer button:hover { color: var(--ink); background: var(--line); }
.layer .dim { opacity: .45; }
.ds { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.ds-head { padding: 8px 9px; display: flex; flex-direction: column; gap: 5px; background: var(--panel-2); }
.ds-head .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.ds-head .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-head .meta { color: var(--ink-3); font-size: 11.5px; }
.ds-actions { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--warn-bg); color: var(--warn-ink); border-radius: 4px; padding: 1px 5px; flex: none; }
.cols { max-height: 230px; overflow-y: auto; padding: 4px; }
.col { display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: transparent; text-align: left; padding: 3px 6px; border-radius: 5px; min-width: 0; }
.col:hover { background: var(--panel-2); }
.col .ty { font: 600 10.5px var(--f-mono); color: var(--ink-3); width: 14px; text-align: center; flex: none; }
.col .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col .rm { opacity: 0; color: var(--ink-3); display: inline-flex; }
.col:hover .rm { opacity: 1; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.stack .btn { justify-content: flex-start; }

/* ---------- inspector fields ---------- */
.row { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 28px; }
.row > label, .row > .lb { color: var(--ink-2); font-size: 12px; }
.row.full { grid-template-columns: minmax(0, 1fr); }
.in { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 7px; height: 28px; }
textarea.in { height: auto; resize: vertical; line-height: 1.4; }
.in:focus { outline: none; border-color: var(--accent); }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.numf { display: flex; align-items: center; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; height: 28px; min-width: 0; }
.numf:focus-within { border-color: var(--accent); }
.numf span { padding-left: 7px; color: var(--ink-3); font-size: 11px; font-weight: 600; flex: none; }
.numf input { border: 0; background: transparent; width: 100%; min-width: 0; padding: 0 6px; height: 100%; outline: none; font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.seg button { flex: 1; border: 0; background: transparent; padding: 4px 4px; display: inline-flex; justify-content: center; align-items: center; gap: 4px; color: var(--ink-2); min-width: 0; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: 1 0 25%; border-left: 0; }
.check { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 12px; min-height: 24px; }
.check input { accent-color: var(--accent); margin: 0; }
.fxlink { display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; border: 1px dashed var(--line); background: var(--bg); border-radius: 6px; padding: 4px 7px; min-height: 28px; text-align: left; }
.fxlink:hover { border-color: var(--accent); border-style: solid; }
.fxlink i { font: italic 600 10.5px var(--f-mono); color: var(--accent); flex: none; }
.fxlink code { font: 500 11.5px var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fxlink code.empty { color: var(--ink-3); font-family: var(--f-ui); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 7px; display: flex; flex-direction: column; gap: 6px; }
.card-top { display: flex; gap: 6px; align-items: center; }
.swatch { width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); display: flex; align-items: center; gap: 7px; padding: 0 6px; min-width: 0; }
.swatch i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--d-border); flex: none; background-image: linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%), linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%); background-size: 8px 8px; background-position: 0 0, 4px 4px; position: relative; overflow: hidden; }
.swatch i b { position: absolute; inset: 0; }
.swatch span { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop { position: fixed; z-index: 80; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 10px; width: 216px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.chip { aspect-ratio: 1; border-radius: 5px; border: 1px solid var(--d-border); padding: 0; }
.chip:hover { transform: scale(1.12); }

  class FormulaError extends Error {

function acceptAc(i) {
  const it = fx.items[i], ctx = fx.ctx, ta = $('#fx-ta');
  if (!it) return;
  let end = ctx.pos;
  if (ctx.type !== 'fn' && ta.value[end] === ']') end++;
  if (ctx.type === 'fn' && ta.value[end] === '(' && it.insert.endsWith('(')) end++;
  ta.value = ta.value.slice(0, ctx.start) + it.insert + ta.value.slice(end);
  const pos = ctx.start + it.insert.length;
  ta.focus(); ta.setSelectionRange(pos, pos);

}
function toggleFnRef(anchor) {
  if (anchor.hasAttribute('data-pop')) { closePops(); return; }
  closePops();
  const search = h('input', { type: 'search', placeholder: 'Search functions', 'aria-label': 'Search functions', id: 'fn-search' });
  const list = h('div', { class: 'fnref-list' });
  const draw = () => {
    const q = search.value.trim().toLowerCase();
    list.textContent = '';
    let cat = '';
    for (const d of Formula.DOCS) {
      if (q && !(d.name.toLowerCase().includes(q) || d.d.toLowerCase().includes(q))) continue;
      if (d.cat !== cat) { cat = d.cat; list.append(h('h4', null, cat)); }
      const b = h('button', { type: 'button' }, h('code', null, d.sig), h('small', null, d.d));
      b.addEventListener('pointerdown', e => e.preventDefault());
      b.addEventListener('click', () => { if (!fx.field) { toast('Select an element first, then pick a function to add it to the formula.'); return; } insertFx(d.name + (d.name === 'Today' || d.name === 'Now' ? '()' : '(')); });
      list.append(b);
    }
    if (!list.children.length) list.append(h('p', { class: 'hint', style: { padding: '8px' } }, 'No function matches that search.'));
  };
  search.addEventListener('input', draw);
  draw();
  const pop = h('div', { class: 'fnref' }, search, list,
    h('p', { class: 'hint', style: { padding: '8px 12px', borderTop: '1px solid var(--line)' } }, 'Operators: + − * / ^ & (join text) = <> < <= > >= and or not. Write 25% for 0.25. Slider controls are @Name.'));
  $('#fx').append(pop);

}
function initFx() {
  const ta = $('#fx-ta'), sel = $('#fx-field'), help = $('#fx-help');
  help.append(ic('book'), h('span', { class: 'hide-narrow' }, 'Functions'));
  help.addEventListener('click', () => toggleFnRef(help));

  ta.addEventListener('click', () => { if (!$('#fx-ac').hidden) showAc(); });
  ta.addEventListener('focus', () => { fx.orig = ta.value; fx.cond = condSig(fx.el); });
  ta.addEventListener('blur', e => {

    const intoPanel = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('#right');
    if (condSig(fx.el) !== fx.cond && !intoPanel) S.struct++;
    commit();
  });
  ta.addEventListener('keydown', e => {
    e.stopPropagation();
    const open = !$('#fx-ac').hidden && fx.items.length;
    if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      fx.idx = (fx.idx + (e.key === 'ArrowDown' ? 1 : -1) + fx.items.length) % fx.items.length;
      [...$('#fx-ac').children].forEach((n, i) => { n.classList.toggle('on', i === fx.idx); if (i === fx.idx) n.scrollIntoView({ block: 'nearest' }); });
    } else if (open && (e.key === 'Enter' || e.key === 'Tab')) { e.preventDefault(); acceptAc(fx.idx); }
    else if (e.key === 'Escape') { if (open) hideAc(); else { ta.value = fx.orig; fxChanged(); ta.blur(); } }
    else if (e.key === 'Enter' && !e.shiftKey && fx.field && fx.field.kind !== 'text') { e.preventDefault(); ta.blur(); }

/* ===== store: keeps the dashboard, its data sets and images.
   Uses the artifact database when the page runs inside Claude, this browser's storage otherwise. ===== */
const Store = (() => {
  let db = null, user = null, downloads = null, mode = 'pending';
  const dirty = { board: false, ds: new Map(), dsDel: new Set(), img: new Set() };
  let timer = null, busy = false, firstDirty = 0, standalone = false;
  const savedImgs = new Set(), savedChunks = new Map(), tooBig = new Set();
  const LS = 'offgrid.studio.v1', FLAG = 'offgrid.studio.cloud', MAX_CHUNKS = 60;
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function retry(fn) {
    try { return await fn(); }
    catch (e) { if (e && e.code === 'unavailable') { await wait(400 + Math.random() * 500); return fn(); } throw e; }
  }
  const chunkPath = (id, i) => `datasets/${id}/chunks/c${String(i).padStart(4, '0')}`;
  function status(state, msg, tip) { S.save = { state, msg, tip }; renderStatus(); }
  function usedImages(board) {
    const s = new Set();
    for (const p of (board || S.board).pages) for (const e of p.els || []) if (e.type === 'image' && e.img) s.add(e.img);
    return s;
  }
  const colMeta = ds => ds.columns.map(c => (c.formula ? { name: c.name, type: c.type, formula: c.formula } : { name: c.name, type: c.type }));

  function bundle() {
    const used = usedImages();
    return {
      app: 'offgrid-studio', v: 1, board: clone(S.board),
      datasets: [...S.datasets.values()].map(ds => ({ id: ds.id, name: ds.name, sample: ds.sample || null, columns: colMeta(ds), rows: ds.sample ? null : ds.rows.map(r => Data.encodeRow(Data.baseCols(ds), r)) })),
      images: Object.fromEntries([...S.images].filter(([id]) => used.has(id))),
    };
  }
  function reviveDs(d) {
    if (d.sample) {
      const ds = Data.sampleOrders();
      ds.id = d.id; ds.name = d.name || ds.name;
      for (const c of d.columns || []) if (c.formula && !ds.columns.some(x => x.name === c.name)) ds.columns.push({ name: c.name, type: c.type, formula: c.formula });
      return ds;
    }
    return { id: d.id, name: d.name || 'Data', columns: d.columns || [], rows: Data.decodeRows(d.columns || [], d.rows || []) };
  }
  function unbundle(j) {
    if (!j || !j.board || !Array.isArray(j.board.pages) || !j.board.pages.length) throw new Error('Not a dashboard file');
    return { board: j.board, datasets: (j.datasets || []).map(reviveDs), images: j.images || {} };
  }

  /* ---------- load ---------- */
  async function init() {
    if (!(window.claude && typeof window.claude.use === 'function')) { mode = 'local'; standalone = true; S.canExport = true; return loadLocal(); }
    try { [db, user, downloads] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]); }
    catch (e) { db = null; }
    S.canExport = !!downloads;
    if (!db) { mode = 'local'; return loadLocal(); }
    mode = 'db';
    try { if (user && (await user.can('data.write')) === false) S.canWrite = false; } catch (e) { /* unknown: a refused write decides */ }
    return loadDb();
  }
  function loadLocal() {
    const raw = lsGet(LS);
    if (!raw) return null;
    try { return unbundle(JSON.parse(raw)); } catch (e) { return null; }
  }
  async function loadDb() {
    const snap = await retry(() => db.doc('boards/main').get());
    if (!snap.exists) { lsSet(FLAG, '0'); return null; }
    lsSet(FLAG, '1');
    const body = clone(snap.data());
    if (!body.board || !Array.isArray(body.board.pages) || !body.board.pages.length) return null;
    const metas = await retry(() => db.collection('datasets').get());
    const datasets = [];
    for (const d of metas.docs) {
      const m = clone(d.data()); m.id = d.id;
      savedChunks.set(d.id, m.chunks || 0);
      if (m.sample) { datasets.push(reviveDs(m)); continue; }
      const arrays = [], n = m.chunks || 0;
      for (let i = 0; i < n; i += 4) {
        const part = await Promise.all([0, 1, 2, 3].filter(k => i + k < n).map(k => retry(() => db.doc(chunkPath(d.id, i + k)).get())));
        for (const p of part) if (p.exists) for (const r of JSON.parse(p.data().data)) arrays.push(r);
      }
      datasets.push({ id: d.id, name: m.name || 'Data', columns: m.columns || [], rows: Data.decodeRows(m.columns || [], arrays) });
    }
    const order = body.dataOrder || [];
    const rank = id => { const i = order.indexOf(id); return i < 0 ? order.length : i; };
    datasets.sort((a, b) => rank(a.id) - rank(b.id));
    const images = {}, used = usedImages(body.board);
    await Promise.all([...used].map(async id => {
      try { const s = await retry(() => db.doc('images/' + id).get()); if (s.exists) { images[id] = s.data().data; savedImgs.add(id); } } catch (e) { /* shows as a missing image */ }
    }));
    if (S.canWrite) for (const id of body.imgs || []) if (!used.has(id)) db.doc('images/' + id).delete().catch(() => {});
    return { board: body.board, datasets, images };
  }

  /* ---------- save ---------- */
  function announce() {
    if (!S.canWrite) return status('idle', 'View only', 'You can explore this dashboard. Changes you make here are not saved.');
    if (mode === 'local') return status('idle', 'Kept in this browser', standalone ? 'Saved in this browser. Use "Save a copy as a file" from the menu for a backup.' : 'This view cannot reach the shared store, so the dashboard is kept in this browser only.');
    status('saved', 'Saved', 'Changes save automatically.');
  }
  function schedule() {
    if (!S.ready || !S.canWrite || mode === 'pending') return;
    status('saving', 'Saving…');
    clearTimeout(timer);
    /* wait for a pause in editing, but never hold changes back longer than a few seconds */
    if (!firstDirty) firstDirty = Date.now();
    timer = setTimeout(flush, Date.now() - firstDirty > 5000 ? 0 : 1200);
  }
  const dirtyBoard = () => { dirty.board = true; schedule(); };
  const dirtyDs = (id, rows) => { dirty.ds.set(id, !!rows || !!dirty.ds.get(id)); dirty.dsDel.delete(id); tooBig.delete(id); if (!savedChunks.has(id)) dirty.board = true; schedule(); };
  const removeDs = id => { dirty.ds.delete(id); dirty.dsDel.add(id); dirty.board = true; schedule(); };
  const dirtyImg = id => { dirty.img.add(id); schedule(); };
  const pending = () => dirty.board || dirty.ds.size || dirty.dsDel.size || dirty.img.size;

  async function saveDs(ds, withRows) {
    let n = savedChunks.get(ds.id);
    if (!ds.sample && (withRows || n == null)) {
      const chunks = Data.chunkRows(ds);
      if (chunks.length > MAX_CHUNKS) {
        tooBig.add(ds.id);
        throw { code: 'too_big', message: `“${ds.name}” is too large to save (about ${Math.round(chunks.length * 0.19)} MB, limit ${Math.round(MAX_CHUNKS * 0.19)} MB). It stays for this session only.` };
      }
      for (let i = 0; i < chunks.length; i++) await retry(() => db.doc(chunkPath(ds.id, i)).set({ data: chunks[i] }));
      for (let i = chunks.length; i < (n || 0); i++) await db.doc(chunkPath(ds.id, i)).delete();
      n = chunks.length;
    }
    const meta = { name: ds.name, sample: ds.sample || null, rowCount: ds.rows.length, columns: colMeta(ds), chunks: ds.sample ? 0 : n || 0 };
    await retry(() => db.doc('datasets/' + ds.id).set(meta));
    savedChunks.set(ds.id, meta.chunks);
  }
  async function flushDb() {
    /* a saved board must never point at data or images that were not stored */
    for (const ds of S.datasets.values()) if (!savedChunks.has(ds.id) && !dirty.ds.has(ds.id) && !tooBig.has(ds.id)) dirty.ds.set(ds.id, true);
    for (const id of usedImages()) if (!savedImgs.has(id) && S.images.has(id)) dirty.img.add(id);
    for (const id of [...dirty.img]) {
      dirty.img.delete(id);
      const data = S.images.get(id);
      if (!data) continue;
      try { await retry(() => db.doc('images/' + id).set({ data })); savedImgs.add(id); } catch (e) { dirty.img.add(id); throw e; }
    }
    for (const [id, rows] of [...dirty.ds]) {
      dirty.ds.delete(id);
      const ds = S.datasets.get(id);
      if (!ds) continue;
      try { await saveDs(ds, rows); } catch (e) { if (e.code !== 'too_big') dirty.ds.set(id, rows); throw e; }
    }
    for (const id of [...dirty.dsDel]) {
      dirty.dsDel.delete(id);
      try {
        const n = savedChunks.get(id) || 0;
        for (let i = 0; i < n; i++) await db.doc(chunkPath(id, i)).delete();
        await db.doc('datasets/' + id).delete();
        savedChunks.delete(id);
      } catch (e) { dirty.dsDel.add(id); throw e; }
    }
    if (dirty.board) {
      dirty.board = false;
      const body = { board: clone(S.board), imgs: [...savedImgs], dataOrder: [...S.datasets.keys()], savedAt: new Date().toISOString() };
      if (new TextEncoder().encode(JSON.stringify(body)).length > 250000) throw { code: 'too_big', message: 'This dashboard has too many elements to save in one piece. Split it across fewer pages or remove some elements.' };
      try { await retry(() => db.doc('boards/main').set(body)); lsSet(FLAG, '1'); } catch (e) { dirty.board = true; throw e; }
    }
  }
  function flushLocal() {
    dirty.board = false; dirty.ds.clear(); dirty.dsDel.clear(); dirty.img.clear();
    if (!lsSet(LS, JSON.stringify(bundle()))) throw { code: 'too_big', message: 'Too large to keep in this browser. Open it inside Claude to save it.' };
  }
  async function flush() {
    clearTimeout(timer); timer = null;
    if (busy) { timer = setTimeout(flush, 600); return; }
    busy = true; firstDirty = 0;
    let failed = null;
    try { if (mode === 'db') await flushDb(); else if (mode === 'local') flushLocal(); }
    catch (e) { failed = e || {}; }
    busy = false;
    if (failed) {
      const c = failed.code;
      const msg = c === 'too_big' ? failed.message
        : c === 'quota_exceeded' ? 'Storage for this dashboard is full. Remove a data set or some images.'
        : c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' ? 'Changes are not being saved. You may only have view access.'
        : 'Could not save just now. It will try again after your next change.';
      status('error', 'Not saved', msg);
      toast(msg, 7000);
      if (c === 'too_big' && pending()) timer = setTimeout(flush, 800);
      return;
    }
    if (pending()) { timer = setTimeout(flush, 800); return; }
    if (mode === 'local') status('saved', 'Kept in this browser', 'This view cannot reach the shared store, so the dashboard is kept in this browser only.');
    else status('saved', 'Saved', 'Changes save automatically.');
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && timer && !busy) flush(); });

  async function saveFile(filename, data) {
    if (downloads) return downloads.save({ filename, data });
    if (!standalone) throw { code: 'unavailable' };
    /* opened as a plain web page (not inside Claude): an ordinary browser download */
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = h('a', { href: url, download: filename });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { status: 'saved' };
  }
  return { init, announce, bundle, unbundle, dirtyBoard, dirtyDs, removeDs, dirtyImg, saveFile, expectCloud: () => lsGet(FLAG) === '1' };
})();

function normalizeBoard(b) {

  if (!Array.isArray(b.pages) || !b.pages.length) b.pages = [{ id: uid('pg_'), name: 'Page 1', els: [] }];

    p.id = p.id || uid('pg_'); p.name = p.name || 'Page'; p.els = Array.isArray(p.els) ? p.els.filter(e => e && RENDER[e.type]) : [];
    for (const e of p.els) {
      e.id = e.id || uid('el_'); e.style = e.style || {}; e.rules = Array.isArray(e.rules) ? e.rules : [];
      for (const k of ['x', 'y', 'w', 'h']) e[k] = Number.isFinite(+e[k]) ? +e[k] : k === 'w' || k === 'h' ? 100 : 0;
      e.rot = +e.rot || 0;
      if ((e.type === 'chart' || e.type === 'table') && !Array.isArray(e.measures)) e.measures = [];
      if (e.type === 'chart') e.cat = e.cat || { col: '', bucket: 'month' };
      if (e.type === 'kpi') e.spark = e.spark || { col: '', bucket: 'month', f: '' };

}
function loadState(st) {

  S.board = st.board;
  S.datasets = new Map();
  for (const ds of st.datasets || []) { S.datasets.set(ds.id, ds); recomputeCalc(ds); }
  S.images = new Map(Object.entries(st.images || {}));
  S.pageId = S.board.pages[0].id;
  S.sel.clear(); S.undo = []; S.redo = []; S.views.clear();
  S.lastSnap = snapshot();

}
function replaceState(st, msg) {
  const before = new Map(S.datasets);
  loadState(st);
  for (const id of before.keys()) if (!S.datasets.has(id)) Store.removeDs(id);
  for (const ds of S.datasets.values()) Store.dirtyDs(ds.id, before.get(ds.id) !== ds);
  for (const id of S.images.keys()) Store.dirtyImg(id);
  Store.dirtyBoard();
  renderAll(); fitView();
  if (msg) toast(msg);
}
async function exportBoard() {
  softCommit();
  const name = (S.board.name || 'dashboard').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'dashboard';
  try { await Store.saveFile(name + '.offgrid.json', JSON.stringify(Store.bundle())); toast('Saved a copy of this dashboard.'); }
  catch (e) { if (e && e.code !== 'declined') toast('Could not save the file from this view.'); }
}

async function boot() {
  initCanvas(); buildTop(); initFx();
  $('#pick-data').addEventListener('change', e => { [...e.target.files].forEach(importDataFile); });
  loadState(sampleState());
  let veil = null;
  if (Store.expectCloud()) { veil = h('div', { class: 'veil' }, 'Opening your dashboard…'); $('#viewport').append(veil); S.loading = true; }
  renderAll(); fitView();
  const bump = () => { S.themeEpoch++; renderCanvas(); };
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', bump);
  new MutationObserver(bump).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(bump);
  if (!window.Chart) {
    const alt = h('script', { src: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js' });
    alt.addEventListener('load', bump);
    document.head.append(alt);
  }
  let loaded = null;
  try { loaded = await Store.init(); }
  catch (e) { toast('Could not open the saved dashboard, so this is the sample.', 6000); }
  if (loaded) { try { loadState(loaded); } catch (e) { loadState(sampleState()); toast('The saved dashboard could not be read, so this is the sample.', 6000); } }
  S.loading = false; if (veil) veil.remove();
  const editedEarly = !loaded && S.undo.length > 0;
  S.ready = true;
  if (!S.canWrite) { S.mode = 'view'; $('#app').dataset.mode = 'view'; S.sel.clear(); }
  S.struct++;
  renderAll();
  if (loaded || !S.canWrite) fitView();
  Store.announce();
  if (editedEarly) Store.dirtyBoard();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
