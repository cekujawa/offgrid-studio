<title>Offgrid Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,600&display=swap">
<style>
/*__CSS__*/
</style>
<div class="app" id="app" data-mode="edit">
  <header class="top" id="top"></header>
  <div class="fx off" id="fx">
    <span class="fx-badge" aria-hidden="true">fx</span>
    <select id="fx-field" aria-label="Which formula to edit" hidden></select>
    <div class="fx-edit" id="fx-edit">
      <pre class="fx-hl" id="fx-hl" aria-hidden="true"></pre>
      <textarea class="fx-ta" id="fx-ta" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Formula" disabled placeholder="Select a KPI, chart, shape or text, then write its formula here"></textarea>
    </div>
    <div class="fx-out" id="fx-out" aria-live="polite"></div>
    <button class="btn" id="fx-help" type="button" title="Function reference"></button>
    <div class="ac" id="fx-ac" role="listbox" aria-label="Suggestions" hidden></div>
  </div>
  <div class="main" id="main">
    <aside class="rail left" id="left" aria-label="Insert, layers and data"></aside>
    <div class="viewport" id="viewport">
      <div class="stage" id="stage"><div id="els"></div><div class="overlay" id="overlay"></div></div>
      <div class="hud info" id="hud-info"></div>
      <div class="hud zoom" id="hud-zoom"></div>
    </div>
    <aside class="rail right" id="right" aria-label="Design"></aside>
  </div>
  <nav class="dock" id="dock" aria-label="Panels"></nav>
</div>
<div id="layer"></div>
<input type="file" id="pick-data" accept=".csv,.tsv,.txt,.json,text/csv,application/json" multiple hidden>
<input type="file" id="pick-image" accept="image/*" hidden>
<input type="file" id="pick-board" accept=".json,application/json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/*__JS__*/
</script>
